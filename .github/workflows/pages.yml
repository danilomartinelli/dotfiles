name: Pages

# Publish _site/ to GitHub Pages. The page is served exactly as tracked, so
# the deployment waits for CI: a page whose runners are stale, or whose files
# break what tests/site_test.sh holds them to, is never published. A manual
# run publishes main as it stands and is for republishing, not for skipping a
# failed check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a running one finishes: cancelling it midway
# can leave the site between two versions.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # CI also runs for pull requests; only its push runs on main publish.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publish the commit CI checked, not whatever main has moved to since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
