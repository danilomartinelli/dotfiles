name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks below are the static checks and the safe suite that
# CODING_STANDARDS.md documents; change them together. Vendored agent skills
# under .agents/ are upstream payloads recorded in skills-lock.json, so the
# checks skip them.
jobs:
  check:
    # The fixtures fake every external command but assume the macOS userland
    # the repository configures.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      # The secret scan reads every commit, not only the checked-out tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare Mise policy
        run: |
          policy="$(_scripts/mise-policy "$GITHUB_WORKSPACE" ci)"
          printf '%s\n' "$policy" >> "$GITHUB_ENV"

      - name: Install locked check tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.12"
          install_args: >-
            aqua:koalaman/shellcheck go go:mvdan.cc/sh/v3/cmd/shfmt
            python uv pipx:mdformat
          cache_key_prefix: ci-mise-${{ hashFiles('mise/config.toml', 'mise/mise.lock') }}

      - name: ShellCheck
        run: |
          git grep -IlzE '^#!.*(bin/sh|bash)([[:space:]]|$)' -- ':!*.md' ':!.agents/' \
            | xargs -0 shellcheck

      - name: shfmt
        run: |
          git grep -IlzE '^#!.*(bin/sh|bash)([[:space:]]|$)' -- ':!*.md' ':!.agents/' \
            | xargs -0 shfmt -d -i 2 -ci -bn

      # zsh -n reads one script and treats further paths as its arguments, so
      # each file gets its own invocation.
      - name: Zsh syntax
        run: git ls-files -z -- '*.zsh' | xargs -0 -n1 zsh -n

      - name: Markdown format
        run: |
          git ls-files -z -- '*.md' ':!.agents/' \
            | xargs -0 mdformat --check

      # Homebrew provides gitleaks on the Mac, so it does here as well; the
      # release is not pinned, which a secret scanner is better for.
      - name: Secret scan
        run: |
          brew install gitleaks
          gitleaks git --redact --no-banner .

      - name: Tests
        run: _scripts/test
