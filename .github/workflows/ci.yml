name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks below are the static checks and the safe suite that
# CODING_STANDARDS.md documents; change them together. Vendored agent skills
# under .agents/ are upstream payloads recorded in skills-lock.json, so the
# checks skip them.
jobs:
  check:
    # The fixtures fake every external command but assume the macOS userland
    # the repository configures.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      MISE_CONFIG_DIR: ${{ github.workspace }}/mise
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/config.toml
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/mise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked check tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.15"
          install_args: >-
            --locked aqua:koalaman/shellcheck go go:mvdan.cc/sh/v3/cmd/shfmt
            python uv pipx:mdformat
          cache_key_prefix: ci-mise-${{ hashFiles('mise/config.toml', 'mise/mise.lock') }}

      - name: ShellCheck
        run: |
          git grep -IlzE '^#!.*(bin/sh|bash)([[:space:]]|$)' -- ':!*.md' ':!.agents/' \
            | xargs -0 shellcheck

      - name: shfmt
        run: |
          git grep -IlzE '^#!.*(bin/sh|bash)([[:space:]]|$)' -- ':!*.md' ':!.agents/' \
            | xargs -0 shfmt -d -i 2 -ci -bn

      # zsh -n reads one script and treats further paths as its arguments, so
      # each file gets its own invocation.
      - name: Zsh syntax
        run: git ls-files -z -- '*.zsh' | xargs -0 -n1 zsh -n

      - name: Markdown format
        run: |
          git ls-files -z -- '*.md' ':!.agents/' \
            | xargs -0 mdformat --check

      - name: Tests
        run: _scripts/test
