[tools]
"aqua:koalaman/shellcheck" = "latest"
bun = "1.3.2"
elixir = "1.18"
erlang = "28"
go = "1.25.5"
"go:mvdan.cc/sh/v3/cmd/shfmt" = "latest"
java = "temurin-21"
node = "lts"
"npm:@anthropic-ai/claude-code" = "2.1.223"
"npm:@agentclientprotocol/claude-agent-acp" = "0.65.0"
"npm:@agentclientprotocol/codex-acp" = "1.1.13"
"npm:@earendil-works/pi-coding-agent" = "0.84.0"
"npm:@colbymchenry/codegraph" = "1.5.0"
"npm:@rama_nigg/open-cursor" = "2.5.6"
"npm:@openai/codex" = "0.146.1"
"npm:eas-cli" = "16.28.0"
"npm:ocx" = "2.0.14"
"npm:opencode-ai" = "1.18.14"
"npm:skills" = "1.5.21"
"npm:wrangler" = "4.119.0"
"pipx:aider-chat" = { version = "0.86.2", uvx_args = "--python /opt/homebrew/bin/python3.12" }
"pipx:kimi-cli" = "1.49.0"
# Bare mdformat mangles YAML frontmatter and GFM tables; both plugins are required.
"pipx:mdformat" = { version = "latest", uvx_args = "--with mdformat-gfm --with mdformat-frontmatter" }
pnpm = "10.23.0"
python = "3.14.0"
ruby = "3.4"
rust = "1.91.1"
terraform = "1.14.0"
uv = "latest"
yarn = "4.11.0"

[settings]
idiomatic_version_file_enable_tools = ["node"]
lockfile = true
npm.shell_out = true
python.uv_venv_auto = true
