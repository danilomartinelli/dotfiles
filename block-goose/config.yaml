active_provider: claude-acp
# Goose Desktop is launched by Finder and does not inherit the shell PATH,
# so the mise-provisioned ACP adapters need an explicit search path.
GOOSE_SEARCH_PATHS:
  - "~/.local/share/mise/shims"
  - "/opt/homebrew/bin"
providers:
  claude-acp:
    enabled: true
    model: default
    configured: true
  codex-acp:
    enabled: true
    model: current
    configured: true
